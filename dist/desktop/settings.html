<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>会话状态设置</title>
  <style>
    :root {
      --bg: #1b1b1b;
      --text: #f3f6f7;
      --muted: #a0a9b2;
      --line: rgba(255,255,255,.12);
      --accent: #e5b86a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; color: var(--text); font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { display: flex; flex-direction: column; height: 100%; overflow: hidden; background: transparent; }
    .sheet { display: flex; flex-direction: column; height: 100%; border-radius: 12px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; transform: translateZ(0); }
    header { display: flex; align-items: center; gap: 12px; flex: none; height: 48px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
    h1 { flex: 1; margin: 0; font-size: 14px; font-weight: 600; }
    button, label { font: inherit; color: inherit; -webkit-app-region: no-drag; }
    #close { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--text); cursor: pointer; }
    #close svg { width: 16px; height: 16px; }
    #close:hover, #close:focus-visible { background: rgba(255,255,255,.08); outline: none; }
    main { flex: 1; min-height: 0; overflow: auto; padding: 16px; }
    section { margin: 0 0 20px; }
    section h2 { margin: 0 0 4px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; }
    .hint { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
    .option { display: grid; grid-template-columns: minmax(0, 1fr) 36px; gap: 2px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
    .option strong { grid-column: 1; font-size: 13px; font-weight: 600; }
    .option small { grid-column: 1; color: var(--muted); font-size: 12px; }
    .switch { position: relative; width: 36px; height: 20px; grid-row: 1 / span 2; grid-column: 2; }
    .switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
    .switch i { display: block; height: 20px; border-radius: 999px; background: #3a3a3a; transition: background 160ms ease; }
    .switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #f3f6f7; transition: transform 160ms ease; }
    .switch input:checked + i { background: var(--accent); }
    .switch input:checked + i::after { transform: translateX(16px); }
    .switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
    #preview-notification { margin: 8px 0; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: transparent; cursor: pointer; }
    #preview-notification:disabled { opacity: .45; cursor: not-allowed; }
    #preview-notification:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .duration-option { grid-template-columns: minmax(0, 1fr) auto; }
    .duration-option select { grid-row: 1 / span 2; grid-column: 2; max-width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
    .duration-option select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 360px) { .duration-option { grid-template-columns: minmax(0, 1fr); } .duration-option select { grid-column: 1; grid-row: auto; } }
    @media (prefers-reduced-motion: reduce) { .switch i, .switch i::after { transition: none; } }
  </style>
</head>
<body>
  <div class="sheet">
  <header>
    <h1>设置</h1>
    <button id="close" type="button" aria-label="关闭">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </header>
  <main>
    <section>
      <h2>使用方式</h2>
      <p class="hint">点击单行展开会话卡片；点击卡片右上角的「折叠」恢复单行。</p>
      <p class="hint">拖动单行或卡片左侧的手柄，也可拖动卡片标题栏，调整浮窗位置。</p>
      <p class="hint">右键菜单可最小化到托盘。通知默认跟随悬浮框，也可固定在桌面右下角；单击托盘图标恢复悬浮框，右键打开菜单。</p>
    </section>
    <section>
      <h2>通知</h2>
      <p class="hint">控制通知开关与完成通知停留时长。悬浮框里的会话列表不受影响。</p>
      <label class="option">
        <strong>对话通知</strong>
        <small>有消息待确认时弹出。</small>
        <span class="switch"><input id="notify-conversation" type="checkbox" role="switch" checked><i></i></span>
      </label>
      <label class="option">
        <strong>任务完成通知</strong>
        <small>会话执行完成时弹出。</small>
        <span class="switch"><input id="notify-task-done" type="checkbox" role="switch" checked><i></i></span>
      </label>
      <label class="option duration-option">
        <strong>通知位置</strong>
        <small>默认跟随悬浮框；托盘模式使用桌面右下角。</small>
        <select id="notification-placement" aria-label="通知位置">
          <option value="dock" selected>跟随悬浮框</option><option value="corner">桌面右下角</option>
        </select>
      </label>
      <label class="option duration-option">
        <strong>完成通知停留时长</strong>
        <small>默认 10 秒；不自动消失时需手动收起。修改仅对新通知生效。</small>
        <select id="task-done-duration" aria-label="完成通知停留时长">
          <option value="5">5 秒</option><option value="10" selected>10 秒</option><option value="15">15 秒</option>
          <option value="30">30 秒</option><option value="60">60 秒</option><option value="0">不自动消失</option>
        </select>
      </label>
      <button id="preview-notification" type="button" disabled>预览通知</button>
      <p class="hint">手动预览忽略任务完成通知开关，使用当前时长和位置；仅模拟通知，不打开真实会话。</p>
      <p id="preview-feedback" class="hint" role="status" aria-live="polite"></p>
    </section>
  </main>
  </div>
  <script>
    const conversation = document.getElementById('notify-conversation')
    const taskDone = document.getElementById('notify-task-done')
    const duration = document.getElementById('task-done-duration')
    const placement = document.getElementById('notification-placement')
    const preview = document.getElementById('preview-notification')
    const feedback = document.getElementById('preview-feedback')
    /** 仅接受有效整数秒数；无效配置回退 10 秒。 @param {unknown} value @returns {number} */
    function normalizeDuration(value) {
      return typeof value === 'number' && Number.isSafeInteger(value) && value >= 0 && value <= 86400 ? value : 10
    }
    /** 同步开关和时长，保留预设以外的有效时长。 @param {object} prefs */
    function applyPrefs(prefs) {
      placement.value = prefs?.notificationPlacement === 'corner' ? 'corner' : 'dock'
      conversation.checked = prefs?.notifyConversation !== false
      taskDone.checked = prefs?.notifyTaskDone !== false
      const seconds = normalizeDuration(prefs?.taskDoneDurationSeconds)
      for (const option of duration.querySelectorAll('[data-custom]')) option.remove()
      if (![5, 10, 15, 30, 60, 0].includes(seconds)) {
        const option = document.createElement('option')
        option.value = String(seconds)
        option.textContent = `${seconds} 秒`
        option.dataset.custom = ''
        duration.appendChild(option)
      }
      duration.value = String(seconds)
    }
    let ready = false
    document.getElementById('close').addEventListener('click', () => window.close())
    window.sessionDock.getNotifyPrefs().then((prefs) => {
      applyPrefs(prefs)
      ready = true
      preview.disabled = false
    }).catch((error) => { ready = false; feedback.textContent = `设置读取失败：${error?.message || error}` })
    /** 开关变化后立即保存；读取完成前不回写，避免用默认值覆盖已有设置。 */
    function savePrefs() {
      if (!ready) return
      window.sessionDock.setNotifyPrefs({ notifyConversation: conversation.checked, notifyTaskDone: taskDone.checked, taskDoneDurationSeconds: normalizeDuration(Number(duration.value)), notificationPlacement: placement.value === 'corner' ? 'corner' : 'dock' })
    }
    conversation.addEventListener('change', savePrefs)
    taskDone.addEventListener('change', savePrefs)
    duration.addEventListener('change', savePrefs)
    placement.addEventListener('change', savePrefs)
    /** 手动请求模拟完成通知；不依赖自动通知开关，也不打开会话。 @returns {Promise<void>} */
    async function previewNotification() {
      if (!ready || preview.disabled) return
      preview.disabled = true
      feedback.textContent = ''
      try {
        const result = await window.sessionDock.previewNotification()
        if (result?.ok !== true) throw new Error('预览请求失败')
        feedback.textContent = '已请求预览。'
      } catch (error) {
        feedback.textContent = `预览失败：${error?.message || error}`
      } finally {
        preview.disabled = !ready
      }
    }
    preview.addEventListener('click', previewNotification)
    window.sessionDock.onNotifyPrefs(applyPrefs)
  </script>
</body>
</html>
